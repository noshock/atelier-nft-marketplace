<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier — Collect independent art on-chain</title>
  <meta name="description" content="An NFT marketplace with creator royalties, declining-price sales, timed auctions and gasless private sale links." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316150F'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23C8553D'/%3E%3Crect x='7' y='20' width='18' height='5' fill='%23F6F4EF'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="#/" class="wordmark" aria-label="Atelier home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><circle cx="16" cy="13" r="6" fill="#C8553D"/><rect x="7" y="20" width="18" height="5" fill="var(--paper)"/></svg>
        <span>Atelier</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="explore">Explore</a>
        <a href="#/auctions" data-nav="auctions">Auctions</a>
        <a href="#/create" data-nav="create">Create</a>
        <a href="#/profile" data-nav="profile">Profile</a>
      </nav>
      <div class="topbar__right">
        <span class="network" id="network-pill"></span>
        <a href="#/profile" class="balance-chip" id="balance-chip" hidden></a>
        <button class="btn btn--primary btn--sm" id="connect-btn">Connect wallet</button>
      </div>
    </div>
  </header>

  <div class="banner" id="network-banner" hidden></div>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer__inner">
      <span>Atelier · an open-source NFT marketplace</span>
      <span class="footer__meta" id="footer-meta"></span>
    </div>
  </footer>

  <dialog id="modal" class="modal"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
