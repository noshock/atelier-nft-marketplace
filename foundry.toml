[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./frontend" }]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 110

[lint]
# Auction timing intentionally uses block.timestamp; validator skew (~seconds) is irrelevant at
# 15-minute+ granularity.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
